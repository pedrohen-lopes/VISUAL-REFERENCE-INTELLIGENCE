name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tool-checks:
    name: Tool Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils

      - name: Install Python dependencies
        run: |
          pip install --break-system-packages numpy pillow scikit-image

      - name: Install Playwright
        run: |
          pip install --break-system-packages playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run tool checks
        working-directory: ./tests
        run: python3 run_tool_checks.py

      - name: Upload diff artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-output
          path: /tmp/*/diff/
          retention-days: 7

  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --break-system-packages numpy pillow

      - name: Validate design tokens template
        run: python3 tools/validate_tokens.py templates/DESIGN_TOKENS_TEMPLATE.json

      - name: Validate make_handoff works
        run: |
          python3 tools/make_handoff.py --target /tmp/test-handoff
          test -f /tmp/test-handoff/CLAUDE.md
          test -f /tmp/test-handoff/.claude/commands/analisar.md
          test -f /tmp/test-handoff/spec/specification.md
          test -f /tmp/test-handoff/spec/tokens.json